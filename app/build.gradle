plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.umineko.android'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'dev.umineko.android'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                cppFlags '-std=gnu++14'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    lint { abortOnError false }
}

